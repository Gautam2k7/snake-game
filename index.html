<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game - Gautam Pattanayak</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e94560;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #16213e;
      text-shadow: 0 0 10px #e94560;
    }
    .game-container {
      position: relative;
      border: 4px solid #e94560;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #0f3460;
    }
    .score-board {
      display: flex;
      justify-content: space-between;
      width: 400px;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
      color: #e94560;
    }
    .controls {
      margin-top: 1rem;
      color: #16213e;
      font-size: 0.9rem;
    }
    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 23, 39, 0.9);
      border: 2px solid #e94560;
      padding: 2rem;
      border-radius: 8px;
      text-align: center;
      display: none;
      z-index: 10;
    }
    .game-over h2 {
      color: #e94560;
      margin-bottom: 0.5rem;
    }
    .game-over p {
      margin-bottom: 1rem;
      color: #ffffff;
    }
    button {
      background: #e94560;
      border: none;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.3s;
    }
    button:hover {
      background: #c2324f;
    }
  </style>
</head>
<body>
  <h1>Snake Game</h1>
  <div class="score-board">
    <div>Score: <span id="score">0</span></div>
    <div>High Score: <span id="highScore">0</span></div>
  </div>
  <div class="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="game-over" id="gameOver">
      <h2>Game Over</h2>
      <p>Final Score: <span id="finalScore">0</span></p>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>
  <div class="controls">
    Use Arrow Keys to move " Press Space to pause
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const gameOverEl = document.getElementById('gameOver');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameLoop;
    let isPaused = false;
    let isGameOver = false;

    highScoreEl.textContent = highScore;

    function draw() {
      if (isPaused || isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw food
      ctx.fillStyle = '#e94560';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

      // Draw snake
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#16213e' : '#533483';
        ctx.strokeStyle = '#0f3460';
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
        ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      });

      // Move snake
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }
        placeFood();
      } else {
        snake.pop();
      }

      gameLoop = setTimeout(draw, 150);
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // Make sure food doesn't spawn on snake
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          placeFood();
          return;
        }
      }
    }

    function gameOver() {
      isGameOver = true;
      finalScoreEl.textContent = score;
      gameOverEl.style.display = 'block';
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      scoreEl.textContent = '0';
      isPaused = false;
      isGameOver = false;
      gameOverEl.style.display = 'none';
      placeFood();
      draw();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === ' ') {
        isPaused = !isPaused;
        if (!isPaused && !isGameOver) draw();
        return;
      }

      switch (e.key) {
        case 'ArrowUp': if (dy === 0) { dx = 0; dy = -1; } break;
        case 'ArrowDown': if (dy === 0) { dx = 0; dy = 1; } break;
        case 'ArrowLeft': if (dx === 0) { dx = -1; dy = 0; } break;
        case 'ArrowRight': if (dx === 0) { dx = 1; dy = 0; } break;
      }
    });

    placeFood();
    draw();
  </script>
</body>
</html>
